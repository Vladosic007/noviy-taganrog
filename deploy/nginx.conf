# Reverse-proxy: единая точка входа на порт 80, разводит трафик между фронтом и API.
# Для HTTPS на боевом сервере — обёрнуть в Caddy/Traefik/certbot; для demo-развёртывания
# достаточно этой конфигурации.

upstream api_backend {
    server api:3001;
}

upstream web_backend {
    server web:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 15M; # клиентские фото до 5 МБ × 3 штуки = 15 МБ

    # Раздача статичных пользовательских фото
    location /uploads/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Раздача сформированных PDF-обращений
    location /appeals/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    # API — все запросы под /api/
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Фронт (SPA) — всё остальное
    location / {
        proxy_pass http://web_backend;
        proxy_set_header Host $host;
    }
}
